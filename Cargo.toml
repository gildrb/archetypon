[workspace]
members = [
	"crates/archetypon",
	"crates/archetypon-cli",
	"crates/archetypon-web",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/gildrb/archetypon"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
